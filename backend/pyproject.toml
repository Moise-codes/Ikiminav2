[project]
name = "ikimina-backend"
version = "2.0.0"
description = "Production backend API for Rwandan savings groups (ikimina)."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.29.0",
    "alembic==1.14.0",
    "psycopg[binary,pool]==3.2.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.4.0",
    "python-jose[cryptography]==3.3.0",
    "PyJWT==2.9.0",
    "argon2-cffi==23.1.0",
    "redis==5.1.0",
    "httpx==0.27.2",
    "structlog==24.4.0",
    "python-multipart==0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.2",
    "hypothesis==6.100.0",
    "ruff==0.8.0",
    "mypy==1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "C4", "PLE", "PD", "FURB"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
